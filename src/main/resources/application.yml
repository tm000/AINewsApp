server:
  port: ${PORT:8080}
  compression:
    enabled: true

spring:
  application:
    name: ai-news
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/ainews;AUTO_SERVER=TRUE}
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: true

ainews:
  crawl:
    # 起動後この時間が経ってから初回クロール
    initial-delay: PT5S
    # クロール間隔
    interval: PT30M
    # この日数より古い記事は削除
    retention-days: 30
    # RSS に画像が無い記事のうち、記事ページの og:image を取りに行く最大件数（1回のクロールあたり）
    og-image-fetch-limit: 40
    user-agent: "Mozilla/5.0 (compatible; AiNewsBot/0.1; +https://github.com/)"
    # 「今すぐ更新」は前回の巡回開始からこの時間が経つまで受け付けない（連打・いたずら対策）
    manual-cooldown: PT5M
  hacker-news:
    enabled: true
    # Hacker News から拾う最低ポイント
    min-points: 10
    queries: [ "AI", "LLM", "OpenAI", "GPT", "Anthropic", "Claude", "Gemini", "machine learning" ]
  translate:
    # claude | deepl | mymemory | none
    # 空なら Claude のキーがあれば claude、次に DeepL のキーがあれば deepl、どちらも無ければ mymemory
    provider: ${TRANSLATE_PROVIDER:}
    # Claude API のキー（https://console.anthropic.com で発行）。タイトルの翻訳と日本語の 3 行要約を作る
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    claude-model: ${CLAUDE_MODEL:claude-haiku-5-5}
    # Claude / DeepL のとき、巡回のたびに自動で翻訳する海外記事の最大件数と、1 回の API 呼び出しでまとめる件数
    auto-limit: ${TRANSLATE_AUTO_LIMIT:60}
    batch-size: 10
    deepl-api-key: ${DEEPL_API_KEY:}
    # MyMemory はメールアドレスを渡すと1日の無料枠が 5,000 → 50,000 文字に増える
    mymemory-email: ${MYMEMORY_EMAIL:}
  feeds:
    - { name: "TechCrunch", url: "https://techcrunch.com/category/artificial-intelligence/feed/", language: en, weight: 1.2 }
    - { name: "The Verge", url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", language: en, weight: 1.2 }
    - { name: "VentureBeat", url: "https://venturebeat.com/category/ai/feed/", language: en, weight: 1.0 }
    - { name: "MIT Technology Review", url: "https://www.technologyreview.com/topic/artificial-intelligence/feed", language: en, weight: 1.2 }
    - { name: "Ars Technica", url: "https://arstechnica.com/ai/feed/", language: en, weight: 1.1 }
    - { name: "WIRED", url: "https://www.wired.com/feed/tag/ai/latest/rss", language: en, weight: 1.1 }
    - { name: "The Guardian", url: "https://www.theguardian.com/technology/artificialintelligence/rss", language: en, weight: 1.0 }
    - { name: "OpenAI", url: "https://openai.com/news/rss.xml", language: en, weight: 1.5 }
    - { name: "Google AI Blog", url: "https://blog.google/technology/ai/rss/", language: en, weight: 1.3 }
    - { name: "Hugging Face", url: "https://huggingface.co/blog/feed.xml", language: en, weight: 1.0 }
    - { name: "Google DeepMind", url: "https://deepmind.google/blog/rss.xml", language: en, weight: 1.4 }
    - { name: "Microsoft AI Blog", url: "https://blogs.microsoft.com/ai/feed/", language: en, weight: 1.1 }
    - { name: "NVIDIA Blog", url: "https://blogs.nvidia.com/feed/", language: en, weight: 1.0, keywords: [ "AI", "A.I.", "LLM", "GPT", "ChatGPT", "OpenAI", "Anthropic", "Claude", "Gemini", "DeepMind", "Llama", "machine learning", "neural", "chatbot", "generative" ] }
    # Anthropic・Meta AI などは公式の RSS が無いので、Google ニュース（英語版）の検索結果から拾う
    - { name: "Google News", url: "https://news.google.com/rss/search?q=Anthropic+OR+%22Meta+AI%22+OR+%22Mistral+AI%22+OR+xAI+when:2d&hl=en-US&gl=US&ceid=US:en", language: en, weight: 0.8, aggregator: true }
    - { name: "Reddit r/MachineLearning", url: "https://www.reddit.com/r/MachineLearning/top/.rss?t=day", language: en, weight: 0.7 }
    - { name: "Reddit r/LocalLLaMA", url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day", language: en, weight: 0.7 }
    - { name: "ITmedia AI+", url: "https://rss.itmedia.co.jp/rss/2.0/aiplus.xml", language: ja, weight: 1.1 }
    - { name: "AINOW", url: "https://ainow.ai/feed/", language: ja, weight: 0.9 }
    # AI 専門でない媒体は keywords で AI 関連の記事だけに絞る
    - { name: "日経クロステック", url: "https://xtech.nikkei.com/rss/index.rdf", language: ja, weight: 1.1, keywords: [ "AI", "生成AI", "人工知能", "LLM", "GPT", "ChatGPT", "OpenAI", "Anthropic", "Claude", "Gemini", "Copilot", "機械学習", "深層学習", "大規模言語モデル", "AIエージェント" ] }
    - { name: "Publickey", url: "https://www.publickey1.jp/atom.xml", language: ja, weight: 1.0, keywords: [ "AI", "生成AI", "人工知能", "LLM", "GPT", "ChatGPT", "OpenAI", "Anthropic", "Claude", "Gemini", "Copilot", "機械学習", "深層学習", "大規模言語モデル", "AIエージェント" ] }
    - { name: "GIGAZINE", url: "https://gigazine.net/news/rss_2.0/", language: ja, weight: 0.9, keywords: [ "AI", "生成AI", "人工知能", "LLM", "GPT", "ChatGPT", "OpenAI", "Anthropic", "Claude", "Gemini", "Copilot", "機械学習", "深層学習", "大規模言語モデル", "AIエージェント" ] }
    - { name: "Google ニュース", url: "https://news.google.com/rss/search?q=%E7%94%9F%E6%88%90AI&hl=ja&gl=JP&ceid=JP:ja", language: ja, weight: 0.8, aggregator: true }
